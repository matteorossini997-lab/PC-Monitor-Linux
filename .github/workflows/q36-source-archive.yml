name: Q36 source archive

on:
  push:
    branches:
      - automation/q36-source-archive
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download upstream q36 repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Ninnix/q36.git q36
          rm -rf q36/.git

      - name: Record upstream revision
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote https://github.com/Ninnix/q36.git refs/heads/main | awk '{print $1}' > q36/UPSTREAM_COMMIT.txt

      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: q36-upstream-main
          path: q36
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
