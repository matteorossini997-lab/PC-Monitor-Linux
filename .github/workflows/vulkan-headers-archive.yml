name: Vulkan headers archive

on:
  push:
    branches:
      - automation/vulkan-headers-compile
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Vulkan headers
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git Vulkan-Headers
          rm -rf Vulkan-Headers/.git

      - name: Upload headers
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-headers-main
          path: Vulkan-Headers/include
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
